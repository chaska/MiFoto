MOD_MIFOTO_PHOTO="MiFoto - Foto del usuario"
MOD_MIFOTO_PHOTO_XML_DESCRIPTION="Muestra a cada usuario conectado su foto de perfil con los botones para subirla, recortarla, cambiarla y quitarla. Colócalo donde quieras (por ejemplo en la página «Edite su perfil») sin depender de la plantilla. A un visitante sin sesión no le muestra nada. Necesita el componente MiFoto."
